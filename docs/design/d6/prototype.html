;margin:3px 0 0}.settings-row button,.settings-row select{font-size:12px;white-space:nowrap}.settings-row select{max-width:200px;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.settings-section-title{font-size:12px;font-weight:600;margin:30px 0 7px}.status-label{font-size:11px;color:var(--green);display:flex;align-items:center;gap:5px}.help-note{font-size:12px;color:var(--muted);margin:15px 0}.demo-toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--canvas);border-radius:10px;padding:11px 17px;box-shadow:var(--shadow);font-size:12px;z-index:30;max-width:calc(100vw - 40px)}.demo-toast:empty{display:none}dialog{border:1px solid var(--line);border-radius:16px;background:var(--canvas);color:var(--ink);padding:26px;max-width:480px;width:calc(100% - 40px);box-shadow:0 20px 80px #14294d22}dialog::backdrop{background:#15243e40}dialog h2{font:600 22px var(--display);margin:0 0 10px}dialog p{font-size:13px;color:var(--muted)}dialog .choice{display:block;text-align:left;padding:13px 15px;width:100%;margin:12px 0}dialog .choice small{display:block;color:var(--muted);margin-top:3px}.empty{padding:65px 20px;text-align:center}.empty h2{font:600 25px var(--display);letter-spacing:-.7px}.empty p{color:var(--muted)}.empty .avatar{margin:auto;width:50px;height:50px;font-size:20px}.empty button{font-size:12px;margin:5px}.mobile-nav{display:none!important}

<body>
<div class="prototype-bar"><span><strong>OpenBot / Design study</strong><span class="study-note"> · Fictional data · No live actions</span></span><div class="row"><button data-scene="result" aria-pressed="true">Conversation</button><button data-scene="approval" aria-pressed="false">Approval</button><button data-scene="settings" aria-pressed="false">Settings</button><button id="theme" aria-label="Switch to dark appearance">Dark</button></div></div>
<div class="app">
<nav class="sidebar" aria-label="Main navigation">
 <div class="brand row"><span class="logo" data-icon="bot"></span>OpenBot<small>Personal</small></div>
 <label class="search"><span data-icon="search"></span><input id="search" aria-label="Search conversations" placeholder="Search conversations"><kbd>⌘ K</kbd></label>
 <div class="roster">
  <div class="section-label">Your assistant<button aria-label="New Bot or group" id="new">+</button></div>
  <button class="person" data-person="OpenBot"><span class="avatar core" data-icon="bot"></span><span class="person-content"><span class="person-name">OpenBot<span class="badge">Core</span></span><span class="person-preview">Here to help you get started</span></span></button>
  <div class="section-label">Bots</div>
  <button class="person active" data-person="Atlas" aria-current="page"><span class="avatar">A</span><span class="person-content"><span class="person-name">Atlas<time>10:42</time></span><span class="person-preview">Your weekly report is ready</span></span></button>
  <button class="person" data-person="Scribe"><span class="avatar plum">S</span><span class="person-content"><span class="person-name">Scribe<time>Yesterday</time></span><span class="person-preview">The introduction reads better now.</span></span></button>
  <button class="person" data-person="Scout"><span class="avatar sage">S</span><span class="person-content"><span class="person-name">Scout</span><span class="person-preview">Sources & research</span></span></button>
  <div class="section-label">Groups</div>
  <button class="person" data-person="Research team"><span class="avatar group" data-icon="group"></span><span class="person-content"><span class="person-name">Research team<time>Tue</time></span><span class="person-preview">Atlas, Scout · 2 members</span></span></button>
  <p id="no-results" class="muted" hidden style="padding:10px;font-size:12px">No conversations match.</p>
 </div>
 <div class="sidebar-bottom">
  <button class="nav-item" data-demo="Routines remain a separate page; this study focuses on the conversation and settings."><span data-icon="clock"></span>Routines</button>
  <button class="nav-item" data-demo="Existing connector setup stays available from Connect apps."><span data-icon="plug"></span>Connect apps</button>
  <button class="nav-item" data-demo="The reviewed skill library retains its existing approval flow."><span data-icon="book"></span>Skills</button>
  <button class="nav-item" id="settings"><span data-icon="settings"></span>Settings<span style="margin-left:auto;color:var(--muted);font-size:11px">⌘ ,</span></button>
 </div>
 <div class="local-state"><span class="dot"></span>This Mac · Ready</div>
</nav>
<main class="workspace" id="workspace"></main>
</div>
<dialog id="new-dialog" aria-labelledby="new-title"><div class="row spread"><h2 id="new-title">Grow your team</h2><button class="icon quiet" data-close-dialog aria-label="Close">×</button></div><p>A Bot has a lasting role. A group brings your Bots into one conversation.</p><button class="choice" data-demo="Demo only: the existing Create Bot form opens here.">Create Bot<small>Give a teammate a name and a specific job.</small></button><button class="choice" data-demo="Demo only: the existing group editor opens here.">Create group<small>Choose members and describe the shared task.</small></button></dialog>

<script>
const paths={bot:'<path d="M7 6c-5 3-4 12 2 12 4 0 7-5 7-9 0-5-6-5-9-3Z"/><path d="M8 7c3-5 9-5 10 0 1 4-2 10-6 12"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',group:'<circle cx="8" cy="8" r="3"/><path d="M2 20v-3c0-5 12-5 12 0v3M16 5a3 3 0 0 1 0 6M17 14c4 0 5 2 5 5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',plug:'<path d="M8 3v5m8-5v5M6 8h12v3a6 6 0 0 1-6 6v4M6 8v3a6 6 0 0 0 6 6"/>',book:'<path d="M12 5C8 2 4 3 2 4v15c4-2 7-1 10 1 3-2 6-3 10-1V4c-2-1-6-2-10 1Zm0 0v15"/>',settings:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/>',panel:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',up:'<path d="M12 19V5m-6 6 6-6 6 6"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',check:'<path d="m5 12 4 4L19 6"/>',chevron:'<path d="m9 5 7 7-7 7"/>',file:'<path d="M14 3H5v18h14V8Zm0 0v5h5M8 13h8M8 17h5"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="M12 8v5m0 3v.1"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/>'};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.file}</svg>`;
function hydrate(){document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));}
let scene='result',person='Atlas',settingsTab='Models',approvalDecision=null,drawer=null,returnFocus=null,toastTimer;
const drafts={};
const workspace=document.querySelector('#workspace');
function toast(text){document.querySelector('#toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.querySelector('#toast').textContent='',4500)}
function escapeHtml(value){return value.replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function saveDraft(){const input=document.querySelector('#message');if(input)drafts[person]=input.value}
function choose(next){saveDraft();scene=next;drawer=null;if(next!=='settings')person='Atlas';render()}
function header(){return `<header class="header"><div class="row"><button class="icon quiet mobile-nav" id="mobile-nav" aria-label="Toggle navigation">${icon('menu')}</button><span class="avatar ${person==='OpenBot'?'core':''}">${person==='OpenBot'?icon('bot'):person==='Research team'?icon('group'):person[0]}</span><div><h1>${person}</h1><p>${person==='Atlas'?'Research & reports':person==='Research team'?'Atlas and Scout · Core receives ordinary messages':person==='OpenBot'?'Your personal assistant':person==='Scribe'?'Writing & editing':'Sources & research'}</p></div></div><div class="header-actions"><button class="quiet row" id="details" aria-expanded="false">${icon('panel')}<span class="details-text">Details</span></button><button class="icon quiet" id="more" aria-label="More conversation actions">${icon('more')}</button></div></header>`}
function receipt(){return `<details class="work-receipt"><summary>${icon('check')}<span>Completed · Read 2 files · Created 2 results</span><span class="chevron">${icon('chevron')}</span></summary><ol><li>Read the current and previous weekly revenue files.</li><li>Compared totals and checked the USD currency.</li><li>Published weekly-brief.md and weekly-summary.csv.</li></ol><small>Illustrative completed receipts. Production uses recorded tool results.</small></details>`}
function result(){return `<div class="date">Today, October 22</div><div class="user-message">Compare this week’s revenue with last week and put together a short report. Highlight what changed.</div><div class="author"><span class="avatar">A</span>Atlas<time>10:42</time></div><article class="answer"><h2>Your weekly report is ready.</h2><p>Revenue reached <strong>$13,400</strong>, up <strong>11.7%</strong> from last week. Orbit drove the increase; Relay is the one to watch.</p><p>I checked the source totals and currency, and included a breakdown by product in the report.</p><button class="result" id="preview"><span class="document-thumb" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span><span><span class="result-title">Weekly revenue brief</span><span class="result-meta" style="display:block">weekly-brief.md · 1 KB · Created by Atlas</span><span class="result-open">Preview report</span></span>${icon('arrow')}</button><div class="supporting-file">${icon('file')}<span>Also included</span><button id="csv">weekly-summary.csv</button></div>${receipt()}</article><div class="message-actions"><button class="quiet row" id="copy">${icon('copy')}Copy answer</button></div>`}
function approval(){return `<div class="date">Today, October 22</div><div class="user-message">Run the report generator for this week.</div><div class="author"><span class="avatar">A</span>Atlas<time>10:41</time></div><article class="answer"><p>The report generator is ready. I need your approval before running this command.</p><section class="approval" aria-label="Approval request"><div class="approval-label">${icon('shield')}<span>${approvalDecision||'Approval needed'}</span></div><h3>Run the weekly report generator</h3><p>Review the command and its working folder before allowing it to run.</p><dl><dt>Bot</dt><dd>Atlas</dd><dt>Target</dt><dd>This Mac</dd><dt>Folder</dt><dd>~/OpenBot/reports</dd></dl><pre>python3 generate_report.py --week 2026-10-19</pre><p class="muted">This runs a local program. Its working folder does not limit which files the program can access.</p>${approvalDecision?'<p>This choice is simulated. No command was executed.</p>':`<div class="approval-actions"><button id="deny">Deny</button><button class="primary" id="allow">Allow once</button></div><details><summary>Always allow this command…</summary><p>Applies to this exact command and working folder on this Mac. Grants are shared by all Bots. Ask first rules still take precedence.</p><button id="always">Confirm always allow</button></details>`}</section></article>`}
function empty(){return `<div class="empty"><span class="avatar ${person==='OpenBot'?'core':''}">${person==='OpenBot'?icon('bot'):person[0]}</span><h2>${person==='OpenBot'?'What would you like to get done?':`Start a conversation with ${person}.`}</h2><p>${person==='Research team'?'Send a shared task, or use @ to choose a recipient.':'A clear task is all you need to begin.'}</p><button data-prompt="Help me plan a research task.">Plan a research task</button><button data-prompt="Summarize a file in my workspace.">Summarize a file</button><p><small>Design study: sending adds a local preview only.</small></p></div>`}
function composer(){return `<div class="compose-wrap"><div class="reading">${scene==='approval'&&!approvalDecision?'<div class="pending-row"><span>Waiting for your approval</span><button class="quiet" id="review" style="padding:0;font-size:12px">Review ↑</button></div>':''}</div><form class="compose" id="compose"><textarea id="message" aria-label="Message ${person}" placeholder="${scene==='approval'&&!approvalDecision?'Add context while Atlas waits…':`Message ${person}…`}">${escapeHtml(drafts[person]||'')}</textarea><div class="compose-footer"><div class="compose-tools"><button type="button" class="quiet" data-demo="Demo only: the existing skill picker opens here.">/ Skills</button>${person==='Research team'?'<button type="button" class="quiet" data-demo="Demo only: select group members by stable recipient ID.">@ Core · automatic</button>':''}</div><button class="primary icon send" aria-label="Send message" type="submit">${icon('up')}</button></div></form><div class="compose-hint"><span>Enter to send · Shift + Enter for a new line</span><span>${person==='Research team'?'Private chats stay separate':'Files run on this Mac'}</span></div></div>`}
function settingsContent(){if(settingsTab==='Models')return `<h2>Models</h2><p>Choose how your Bots think. Each Bot can also use its own model.</p><div class="settings-card"><div class="settings-row"><div><strong>Default model</strong><p>Used by Bots without a model of their own.</p></div><select aria-label="Default model"><option>Configured model</option><option>Another configured model</option></select></div></div><div class="row spread settings-section-title"><span>Model connections</span><button class="quiet" data-demo="Demo only: choose Built-in provider or Custom endpoint in the existing setup flow." style="font-size:12px;color:var(--blue)">+ Add connection</button></div><div class="settings-card"><div class="settings-row"><div class="row"><span class="avatar core">M</span><div><strong>My inference endpoint</strong><p>OpenAI compatible · Custom endpoint</p></div></div><span class="status-label"><span class="dot"></span>Configured</span></div><div class="settings-row"><p>API key stored in macOS Keychain</p><button data-demo="Demo only: a connection test must show the actual response or error.">Test connection</button></div></div><p class="help-note">Conversations and local files used as context may be sent to the configured model provider.</p><details class="work-receipt"><summary>Advanced configuration ${icon('chevron')}</summary><p>Existing models.json configuration remains supported. Credentials are never shown here.</p></details>`;
if(settingsTab==='Permissions')return `<h2>Permissions</h2><p>Control when actions need your approval on this Mac.</p><div class="settings-card"><div class="settings-row"><div><strong>Ask first</strong><p>Rules that require your decision before an action.</p></div><button data-demo="Demo only: opens the existing Ask first editor.">Manage</button></div><div class="settings-row"><div><strong>Allow automatically</strong><p>Command and folder grants shared by all Bots.</p></div><button data-demo="Demo only: opens the existing grants list.">Manage</button></div></div><p class="help-note">Ask first rules take precedence over automatic grants. A Bot cannot approve its own actions.</p>`;
if(settingsTab==='General')return `<h2>General</h2><p>Preferences for your desktop app.</p><div class="settings-card"><div class="settings-row"><div><strong>Language</strong><p>Your conversations stay as written.</p></div><span>English · Study only</span></div></div><p class="help-note">The implementation retains English and Simplified Chinese. This prototype illustrates the English layout.</p>`;
return `<h2>Data & storage</h2><p>Your local conversations, files and credentials.</p><div class="settings-card"><div class="settings-row"><div><strong>Workspace</strong><p>~/OpenBot</p></div><button data-demo="Demo only: the existing validated Reveal in Finder action is used here.">Reveal in Finder</button></div><div class="settings-row"><div><strong>Credential storage</strong><p>macOS Keychain</p></div><span class="status-label">Available</span></div></div><p class="help-note">No backup, restore, or cloud sync feature is added by this design.</p>`}
function settings(){return `<section class="settings"><header class="settings-top"><h1>Settings</h1><p>A few preferences for the way you work.</p></header><div class="settings-layout"><nav class="settings-nav" aria-label="Settings categories">${['General','Models','Permissions','Data & storage'].map(x=>`<button data-settings-tab="${x}" class="${settingsTab===x?'active':''}" ${settingsTab===x?'aria-current="page"':''}>${x}</button>`).join('')}</nav><div class="settings-content">${settingsContent()}</div></div></section>`}
function render(){document.querySelectorAll('[data-scene]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.scene===scene)));document.querySelectorAll('[data-person]').forEach(x=>{x.classList.toggle('active',scene!=='settings'&&x.dataset.person===person);if(scene!=='settings'&&x.dataset.person===person)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});workspace.innerHTML=scene==='settings'?settings():`<section class="conversation">${header()}<div class="transcript" id="transcript"><div class="reading" id="messages">${person!=='Atlas'?empty():scene==='approval'?approval():result()}</div></div>${composer()}</section><aside class="inspector" id="inspector" hidden aria-label="Conversation panel"></aside>`;hydrate();if(scene==='approval')document.querySelector('.approval')?.scrollIntoView({block:'end'});const form=document.querySelector('#compose');if(form){const input=document.querySelector('#message');form.onsubmit=send;input.oninput=()=>drafts[person]=input.value;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send(e)}}}}
function send(event){event.preventDefault();const input=document.querySelector('#message'),value=input.value.trim();if(!value)return;const msg=document.createElement('div');msg.className='user-message';msg.textContent=value;document.querySelector('#messages').append(msg);input.value='';drafts[person]='';msg.scrollIntoView({block:'end'});toast('Preview only. No message was sent to a model.');input.focus()}
function openDrawer(type){const pane=document.querySelector('#inspector');returnFocus=document.activeElement;drawer=type;pane.hidden=false;pane.innerHTML=`<header class="inspector-header"><strong>${type==='details'?'Conversation details':type==='csv'?'Data preview':'Report preview'}</strong><button class="icon quiet" id="close-panel" aria-label="Close panel">×</button></header><div class="inspector-body">${type==='details'?`<div class="avatar">${person[0]}</div><h2>${person}</h2><p class="muted">${person==='Atlas'?'Research & reports':'A persistent teammate on your Mac.'}</p><div class="profile-section"><strong>Instructions</strong><p>Find the important changes. Check the source data and give me a concise, usable report.</p><button data-demo="Demo only: opens the existing revision-aware profile editor.">Edit instructions</button></div><div class="profile-section"><strong>Memory</strong><p class="muted">Use USD for revenue reports.</p><button data-demo="Demo only: opens memory with its existing revision history and conflict handling.">Manage memory</button></div><div class="profile-section"><strong>Model</strong><p class="muted">Uses the default model</p></div>`:`<small class="muted">${type==='csv'?'weekly-summary.csv':'weekly-brief.md'} · 1 KB</small><div class="paper"><small class="muted">WEEK OF OCTOBER 19</small><h2>Weekly revenue</h2><p>Revenue reached <strong>$13,400</strong>, up 11.7% from the previous week.</p><table><thead><tr><th>Product</th><th>Revenue</th><th>Change</th></tr></thead><tbody><tr><td>Orbit</td><td>$6,200</td><td>+29.2%</td></tr><tr><td>Beacon</td><td>$4,400</td><td>+10.0%</td></tr><tr><td>Relay</td><td>$2,800</td><td>−12.5%</td></tr></tbody></table><h3>What changed</h3><p>Orbit contributed the full net revenue increase. Relay declined by $400.</p><h3>Next step</h3><p>Review Orbit by customer or channel to understand the increase.</p></div><p class="muted">Fictional sample data. Production previews only supported, validated artifact types.</p>`}</div><footer class="inspector-footer">${type==='details'?'Profile edits use the existing save and conflict flow.':'Read-only preview · No external content loaded'}</footer>`;document.querySelector('#details').setAttribute('aria-expanded','true');document.querySelector('#close-panel').focus()}
function closeDrawer(){document.querySelector('#inspector')?.setAttribute('hidden','');document.querySelector('#details')?.setAttribute('aria-expanded','false');drawer=null;returnFocus?.focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.scene){choose(b.dataset.scene);return}if(b.dataset.person){saveDraft();person=b.dataset.person;scene='result';drawer=null;document.querySelector('.sidebar').classList.remove('mobile-open');render();return}if(b.dataset.demo){toast(b.dataset.demo);return}if(b.dataset.prompt){const input=document.querySelector('#message');input.value=b.dataset.prompt;drafts[person]=input.value;input.focus();return}if(b.dataset.settingsTab){settingsTab=b.dataset.settingsTab;render();document.querySelector(`[data-settings-tab="${settingsTab}"]`).focus();return}switch(b.id){case 'theme':{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';b.textContent=dark?'Light':'Dark';b.setAttribute('aria-label',`Switch to ${dark?'light':'dark'} appearance`);break}case 'settings':choose('settings');break;case 'new':document.querySelector('#new-dialog').showModal();break;case 'preview':openDrawer('report');break;case 'csv':openDrawer('csv');break;case 'details':drawer?closeDrawer():openDrawer('details');break;case 'close-panel':closeDrawer();break;case 'allow':case 'deny':case 'always':approvalDecision=b.id==='deny'?'Denied · Demo':b.id==='always'?'Always allow selected · Demo':'Allowed once · Demo';saveDraft();render();toast('Simulated decision only. No grant or command was created.');break;case 'review':document.querySelector('.approval').scrollIntoView({block:'center'});break;case 'more':toast('Conversation actions: New topic, Duplicate, Hide and Delete keep their existing confirmation rules.');break;case 'mobile-nav':document.querySelector('.sidebar').classList.toggle('mobile-open');break;case 'copy':navigator.clipboard?.writeText('Revenue reached $13,400, up 11.7% from last week. Orbit drove the increase; Relay is the one to watch.').then(()=>toast('Answer copied.')).catch(()=>toast('Clipboard unavailable in this preview.'));break}if(b.hasAttribute('data-close-dialog'))document.querySelector('#new-dialog').close()});
document.querySelector('#search').addEventListener('input',e=>{const query=e.target.value.toLowerCase();let matches=0;document.querySelectorAll('[data-person]').forEach(b=>{const visible=b.textContent.toLowerCase().includes(query);b.hidden=!visible;b.style.display=visible?'':'none';matches+=Number(visible)});document.querySelector('#no-results').hidden=matches>0});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(innerWidth<=650)document.querySelector('.sidebar').classList.add('mobile-open');document.querySelector('#search').focus()}if((e.metaKey||e.ctrlKey)&&e.key===','){e.preventDefault();choose('settings')}if(e.key==='Escape'&&drawer)closeDrawer()});
render();hydrate();
</script>
</body>
</html>
