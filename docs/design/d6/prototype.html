<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenBot · Your personal assistant</title>
<link rel="stylesheet" href="personal.css">
</head>
<body>
<div class="study"><span><b>OpenBot</b><span class="study-caption"> · Personal assistant study · Fictional data</span></span><div class="study-controls"><button data-scene="welcome" aria-pressed="true">Welcome</button><button data-scene="conversation" aria-pressed="false">Conversation</button><button data-scene="approval" aria-pressed="false">Approval</button><button id="appearance" aria-label="Switch to dark appearance">Dark</button></div></div>
<div class="app">
 <nav class="sidebar" aria-label="Main navigation">
  <div class="brand"><span class="brand-symbol" aria-hidden="true">o<span>·</span></span><span>openbot</span><button class="icon-button sidebar-close" aria-label="Close navigation" id="close-nav">×</button></div>
  <button class="search-button" id="search-open"><span data-icon="search"></span><span>Find a conversation</span><kbd>⌘ K</kbd></button>
  <button class="assistant-link selected" data-person="OpenBot" aria-current="page"><span class="mini-companion" data-companion></span><span><strong>OpenBot</strong><small>Your personal assistant</small></span></button>
  <div class="sidebar-section"><span>Your team</span><button class="icon-button" aria-label="Create Bot or group" id="create">+</button></div>
  <div class="team-list">
   <button class="team-link" data-person="Atlas"><span class="initial peach">A</span><span><strong>Atlas</strong><small>Research & reports</small></span></button>
   <button class="team-link" data-person="Scribe"><span class="initial lilac">S</span><span><strong>Scribe</strong><small>Writing & editing</small></span></button>
   <button class="team-link" data-person="Research team"><span class="initial olive" data-icon="group"></span><span><strong>Research team</strong><small>Atlas and Scribe</small></span></button>
  </div>
  <div class="sidebar-spacer"></div>
  <div class="sidebar-tools">
   <button data-dialog="routines"><span data-icon="sun"></span>Routines</button>
   <button data-dialog="apps"><span data-icon="plug"></span>Connect apps</button>
   <button data-dialog="skills"><span data-icon="book"></span>Skills</button>
   <button id="settings"><span data-icon="settings"></span>Settings</button>
  </div>
  <div class="local-status"><span class="tiny-dot"></span><span>On your Mac</span><span class="status-caption">Ready</span></div>
 </nav>
 <main class="main" id="main"></main>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="personal.js"></script>
</body>
</html>
