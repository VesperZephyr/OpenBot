name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Check (macOS)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:pi
      - run: pnpm run check

  e2e:
    name: Desktop e2e (macOS, ${{ matrix.shard }}/3)
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:pi
      - name: Download Electron
        working-directory: apps/desktop
        run: node node_modules/electron/install.js
      - run: pnpm --filter @openbot/desktop run build
      - name: Run desktop shard
        run: pnpm exec vitest run --config e2e/vitest.config.ts --shard=${{ matrix.shard }}/3
      - name: Summarize desktop timings
        if: always()
        run: node scripts/ci-test-summary.mjs e2e/.run/results.json "Desktop shard ${{ matrix.shard }}/3"
      - name: Upload e2e screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.shard }}
          path: |
            e2e/.run/**/*.png
            e2e/.run/results.json
            e2e/.run/history-scaling/performance.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  check:
    # Retain the existing required check name; skipped or failed shards cannot pass it.
    name: Check and e2e (macOS)
    if: always()
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: test "$UNIT_RESULT" = success && test "$E2E_RESULT" = success
